<svg xmlns="http://www.w3.org/2000/svg" viewBox="102 102 620 620" role="img" aria-label="Ash">
  <title>Ash</title>
  <!-- Hearthscale's five-bar mark alone, in the colours of embers: each bar
       fades from orange at the top through red to almost black at its
       base, over a faint red glow. The bars sit on the grid of
       Hearthscale's own app icon (bar centres 169 to 655, base 594, 81
       wide), and the square view box is centred on the mark. -->
  <defs>
    <linearGradient id="ember" x1="412" y1="190" x2="412" y2="634" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff7a2e" />
      <stop offset="0.32" stop-color="#e0401c" />
      <stop offset="0.68" stop-color="#8a160c" />
      <stop offset="1" stop-color="#160504" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" />
    </filter>
  </defs>
  <g stroke-width="81" stroke-linecap="round" fill="none">
    <g stroke="#ff4a1a" opacity="0.2" filter="url(#glow)">
      <path d="M169 594V391.5" />
      <path d="M290.5 594V297" />
      <path d="M412 594V230" />
      <path d="M533.5 594V297" />
      <path d="M655 594V391.5" />
    </g>
    <g stroke="url(#ember)">
      <path d="M169 594V391.5" />
      <path d="M290.5 594V297" />
      <path d="M412 594V230" />
      <path d="M533.5 594V297" />
      <path d="M655 594V391.5" />
    </g>
  </g>
</svg>
